<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>양력·음력 달력</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap");
:root{
  --bg:#f7f2e7;--paper:#fffdf6;--text:#262b3d;--muted:#a4a7b3;--navy:#2c3e73;--navy-soft:#e6e9f4;--on-navy:#fff;
  --sun:#d9453b;--sat:#2f63c9;--line:#e9e2d0;--hover:#f1efe6;--hl:#2c3e73;--shadow:0 2px 10px rgba(60,50,20,.08);--input:#fffdf6;
  --font:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141726;--paper:#1d2136;--text:#e8eaf3;--muted:#6f7590;--navy:#8fa6e8;--navy-soft:#2a3052;--on-navy:#141726;
  --sun:#ff7a70;--sat:#7aa2ff;--line:#2d3350;--hover:#262c47;--hl:#8fa6e8;--shadow:0 2px 12px rgba(0,0,0,.4);--input:#171b2e;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .3s,color .3s}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.card{background:var(--paper);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line);transition:background .3s,border-color .3s}
h1{font-size:1.15rem;margin:0 0 12px;color:var(--navy);letter-spacing:-.02em}
.convert{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.convert input[type=number],.convert select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--input);color:inherit}
.convert input[type=number]{width:5.5em}
.convert input:focus,.convert select:focus{outline:2px solid var(--navy);outline-offset:1px}
.convert label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.convert input[type=checkbox]{width:1.1em;height:1.1em;accent-color:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:8px 12px;transition:background .2s,color .2s,transform .15s}
button:hover{background:var(--navy-soft)}
button:active{transform:scale(.96)}
button.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy);font-weight:600}
button.primary:hover{filter:brightness(1.12);background:var(--navy)}
#result{margin-top:12px;min-height:1.5em;font-weight:600;color:var(--navy)}
#result.error{color:var(--sun)}
.yearbar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px;font-size:1.15rem;font-weight:700;color:var(--navy)}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.months button.active{background:var(--navy);color:var(--on-navy);border-color:var(--navy);font-weight:600}
.calendar{position:relative;padding-top:30px}
.calendar::before{content:"";position:absolute;top:10px;left:18px;right:18px;height:8px;
  background:radial-gradient(circle,var(--line) 0 3px,transparent 3.5px) 0 0/22px 8px repeat-x}
.title{text-align:center;font-size:1.4rem;font-weight:700;margin-bottom:12px;color:var(--navy);letter-spacing:-.02em}
.dow,.grid{display:grid;grid-template-columns:var(--wkw) repeat(7,minmax(0,1fr))}
:root{--wkw:2.4rem}
.dow div{text-align:center;padding:6px 0;font-weight:600;font-size:.85rem;color:var(--muted)}
.dow div:nth-child(2){color:var(--sun)}
.dow div:last-child{color:var(--sat)}
.grid.flip{animation:flip .38s ease both}
@keyframes flip{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wk{border-top:1px dashed var(--line);padding:9px 0 0;text-align:center;font-size:.68rem;color:var(--muted);opacity:.85}
.wk.cur{color:var(--navy);font-weight:800;opacity:1}
.cell{min-height:70px;min-width:0;overflow:hidden;border-top:1px dashed var(--line);padding:5px 4px;display:flex;flex-direction:column;align-items:center;
  transition:background .2s,transform .2s,box-shadow .2s;position:relative}
.cell:not(.blank){cursor:pointer}
.cell:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.cell:not(.blank):hover{background:var(--hover)}
.solar{font-weight:600;font-size:.95rem;min-width:1.9em;height:1.9em;line-height:1.9em;text-align:center;border-radius:50%}
.cell.sun .solar,.cell.holiday .solar,.cell.hnameCell .solar{color:var(--sun)}
.cell.sat:not(.holiday) .solar{color:var(--sat)}
.memo{font-size:.64rem;line-height:1.25;color:var(--navy);margin-top:2px;width:100%;padding:0 3px;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.memo::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--navy);margin-right:3px;vertical-align:middle}
.hint{margin:10px 2px 0;font-size:.78rem;color:var(--muted);text-align:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--text);font-family:var(--font);padding:18px;width:min(92vw,380px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,23,38,.45)}
dialog h2{margin:0 0 4px;font-size:1.05rem;color:var(--navy)}
dialog .sub{font-size:.8rem;color:var(--sun);min-height:1.1em;margin-bottom:8px}
dialog textarea{width:100%;min-height:120px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--input);color:inherit}
dialog textarea:focus{outline:2px solid var(--navy);outline-offset:1px}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dlgbtns .danger{color:var(--sun);margin-right:auto}
.hname{font-size:.62rem;color:var(--sun);margin-top:1px;line-height:1.15;text-align:center;word-break:keep-all}
.cell.today .solar{background:var(--navy);color:var(--on-navy)}
.cell.today .solar::after{content:none}
.cell.selected{background:var(--hl);color:var(--on-navy);border-radius:12px;border-top-color:transparent;transform:scale(1.07);z-index:1;box-shadow:0 4px 14px rgba(44,62,115,.35)}
.cell.selected:hover{background:var(--hl)}
.cell.selected .memo::before{background:var(--on-navy)}
.cell.selected.today .solar{background:var(--on-navy);color:var(--hl)}
@media(max-width:520px){
  :root{--wkw:1.6rem}.wk{font-size:.58rem;padding-top:8px}
  .wrap{padding:10px 8px 24px}.card{padding:14px 12px}
  .months{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cell{min-height:60px;padding:4px 1px}
  .solar{font-size:.85rem}.hname{font-size:.55rem}.memo{font-size:.56rem;padding:0 1px}
  .cell.selected{transform:scale(1.04)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>음력 → 양력 변환</h1>
    <div class="convert">
      <input type="number" id="lunarYear" min="1900" max="2100" aria-label="음력 연도"> 년
      <select id="lunarMonth" aria-label="음력 월"></select> 월
      <input type="number" id="lunarDay" min="1" max="30" aria-label="음력 일" style="width:4.5em"> 일
      <label><input type="checkbox" id="lunarLeap">윤달</label>
      <button class="primary" id="convertBtn">변환</button>
    </div>
    <div id="result"></div>
  </div>
  <div class="card">
    <div class="yearbar"><button id="prevYear" aria-label="이전 해">◀</button><span id="yearLabel"></span><button id="nextYear" aria-label="다음 해">▶</button></div>
    <div class="months" id="months"></div>
  </div>
  <div class="card calendar">
    <div class="title" id="monthTitle"></div>
    <div class="dow"><div></div><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
    <div class="hint">날짜를 누르면 메모를 남길 수 있어요</div>
  </div>
</div>
<dialog id="memoDialog">
  <h2 id="memoDate"></h2>
  <div class="sub" id="memoSub"></div>
  <textarea id="memoText" maxlength="500" placeholder="메모를 입력하세요" aria-label="메모"></textarea>
  <div class="dlgbtns">
    <button type="button" class="danger" id="memoDelete">삭제</button>
    <button type="button" id="memoCancel">취소</button>
    <button type="button" class="primary" id="memoSave">저장</button>
  </div>
</dialog>
<script>
// 연도별 음력 데이터(1900~2100). 1900~2050년은 한국천문연구원(KASI) 기준, 2051~2100년은 천문 계산(ICU) 기준.
// 형식: (윤달 월 << 13) | 월별 대소 비트마스크(비트 i = i번째 달이 30일이면 1)
const LUNAR_START_YEAR = 1900;
const LUNAR_END_YEAR = 2100;
const LUNAR_TABLE = [
  71378,1874,3749,46666,1611,2715,38230,1386,2905,22354,
  1874,56101,2853,2635,45723,2733,1386,19305,2985,64338,
  3474,3365,47693,2390,693,38317,1748,3497,23954,3730,
  52518,1319,2647,45750,2778,1748,28329,1865,63123,2707,
  1323,51803,2413,2922,39764,2980,2889,23187,2709,62763,
  1325,2733,46442,3506,3492,32073,3402,72341,2710,1366,
  51893,2773,1746,36517,3749,3658,27798,2715,62806,1386,
  2905,46930,1874,1829,38475,2635,70315,685,1387,52073,
  3497,3474,39717,3365,88653,2646,694,54701,1748,3497,
  48530,3730,3366,27222,2647,70326,2906,1748,44745,1865,
  1683,38183,1323,2651,21850,874,64341,2980,2889,47763,
  2709,1325,27229,2733,79274,1490,3493,48458,3402,2709,
  38189,1366,2741,21930,1746,52901,3749,3658,44182,3227,
  1370,27349,2921,96082,1874,2853,54859,2635,1195,42331,
  1389,2921,23378,3474,64805,3365,2637,46253,694,1461,
  28073,3785,73362,3730,3366,51798,2647,1238,34517,1877,
  1865,28307,1683,62763,1323,2651,46426,1386,2917,38730,
  2889,72341,2709,1325,51885,2741,1450,35749,3493,3402,
  31893,3222,63822,1366,2741,46514,1746,3749,36426,1675,
  68759,1195,1371,51926,2922,1874,38693,2885,2699,21659,
  1195,
];
const BASE_UTC = Date.UTC(1900, 0, 31); // 음력 1900-01-01
const DAY_MS = 86400000;

/**
 * 해당 음력 연도의 월 구성 반환
 * @param {number} year 음력 연도
 * @returns {{lengths:number[], monthNums:number[], total:number}} monthNums: 윤달은 음수
 */
function getLunarYearInfo(year) {
  const v = LUNAR_TABLE[year - LUNAR_START_YEAR];
  const leapMonth = v >> 13;
  const count = leapMonth ? 13 : 12;
  const lengths = [];
  const monthNums = [];
  let total = 0;
  for (let i = 0; i < count; i++) {
    const len = (v >> i) & 1 ? 30 : 29;
    lengths.push(len);
    total += len;
    // leapMonth 번째 달(1-based) 다음 달(인덱스 leapMonth)이 윤달
    if (!leapMonth || i < leapMonth) monthNums.push(i + 1);
    else if (i === leapMonth) monthNums.push(-leapMonth);
    else monthNums.push(i);
  }
  return { lengths, monthNums, total };
}

/**
 * 양력 날짜를 음력으로 변환
 * @param {number} y 양력 연
 * @param {number} m 양력 월(1~12)
 * @param {number} d 양력 일
 * @returns {{year:number, month:number, day:number, isLeap:boolean}|null} 범위 밖이면 null
 */
function solarToLunar(y, m, d) {
  let offset = Math.round((Date.UTC(y, m - 1, d) - BASE_UTC) / DAY_MS);
  if (offset < 0) return null;
  for (let year = LUNAR_START_YEAR; year <= LUNAR_END_YEAR; year++) {
    const info = getLunarYearInfo(year);
    if (offset < info.total) {
      let i = 0;
      while (offset >= info.lengths[i]) { offset -= info.lengths[i]; i++; }
      const n = info.monthNums[i];
      return { year, month: Math.abs(n), day: offset + 1, isLeap: n < 0 };
    }
    offset -= info.total;
  }
  return null;
}

/**
 * 음력 날짜를 양력으로 변환
 * @param {number} year 음력 연
 * @param {number} month 음력 월(1~12)
 * @param {boolean} isLeap 윤달 여부
 * @param {number} day 음력 일
 * @returns {{date?:{y:number,m:number,d:number}, error?:string}}
 */
function lunarToSolar(year, month, isLeap, day) {
  if (!(year >= LUNAR_START_YEAR && year <= LUNAR_END_YEAR)) return { error: "음력 연도는 1900~2100년만 지원합니다." };
  let offset = 0;
  for (let y = LUNAR_START_YEAR; y < year; y++) offset += getLunarYearInfo(y).total;
  const info = getLunarYearInfo(year);
  const idx = info.monthNums.indexOf(isLeap ? -month : month);
  if (idx < 0) return { error: year + "년에는 " + (isLeap ? "윤" : "") + month + "월이 없습니다." + (isLeap ? " (윤달 없음)" : "") };
  if (!(day >= 1 && day <= info.lengths[idx])) return { error: year + "년 " + (isLeap ? "윤" : "") + month + "월은 " + info.lengths[idx] + "일까지입니다." };
  for (let i = 0; i < idx; i++) offset += info.lengths[i];
  const dt = new Date(BASE_UTC + (offset + day - 1) * DAY_MS);
  if (dt.getTime() > Date.UTC(2100, 11, 31)) return { error: "양력 2100-12-31 이후는 지원하지 않습니다." };
  return { date: { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() } };
}

const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
// 법정 공휴일 외 임시공휴일(연도별로 지정되므로 알려진 날짜만 수록)
const TEMP_HOLIDAYS = {
  "2015-08-14": "임시공휴일", "2016-05-06": "임시공휴일", "2017-05-09": "대통령 선거일", "2017-10-02": "임시공휴일",
  "2020-08-17": "임시공휴일", "2022-03-09": "대통령 선거일", "2022-06-01": "지방선거일", "2023-10-02": "임시공휴일",
  "2024-04-10": "국회의원 선거일", "2024-10-01": "국군의 날", "2025-01-27": "임시공휴일", "2025-06-03": "대통령 선거일",
  "2026-06-03": "지방선거일"
};
const holidayCache = {};

/**
 * 양력 연도의 공휴일 맵 계산 (2013~2100년, 대체공휴일 포함)
 * @param {number} year 양력 연
 * @returns {Object<string,string>} "m-d" -> 공휴일 이름
 */
function getHolidays(year) {
  if (holidayCache[year]) return holidayCache[year];
  const map = {};
  if (year < 2013 || year > 2100) return (holidayCache[year] = map);
  const key = (dt) => (dt.getUTCMonth() + 1) + "-" + dt.getUTCDate();
  const utc = (y, m, d) => new Date(Date.UTC(y, m - 1, d));
  const addDays = (dt, n) => new Date(dt.getTime() + n * DAY_MS);
  const fromLunar = (m, d) => { const r = lunarToSolar(year, m, false, d); return r.date ? utc(r.date.y, r.date.m, r.date.d) : null; };
  // groups: {name, dates[], rule} rule: "sun"=일요일/겹침, "child"=어린이날, "wk"=토·일, "none"
  const groups = [];
  const seol = fromLunar(1, 1);
  const chu = fromLunar(8, 15);
  const sub = year >= 2021;
  groups.push({ name: "신정", dates: [utc(year, 1, 1)], rule: "none" });
  if (seol) groups.push({ name: "설날", dates: [addDays(seol, -1), seol, addDays(seol, 1)], rule: "holiday" });
  groups.push({ name: "삼일절", dates: [utc(year, 3, 1)], rule: sub ? "wk" : "none" });
  groups.push({ name: "어린이날", dates: [utc(year, 5, 5)], rule: "child" });
  const buddha = fromLunar(4, 8);
  if (buddha) groups.push({ name: "부처님오신날", dates: [buddha], rule: sub ? "wk" : "none" });
  groups.push({ name: "현충일", dates: [utc(year, 6, 6)], rule: "none" });
  groups.push({ name: "광복절", dates: [utc(year, 8, 15)], rule: sub ? "wk" : "none" });
  if (chu) groups.push({ name: "추석", dates: [addDays(chu, -1), chu, addDays(chu, 1)], rule: "holiday" });
  groups.push({ name: "개천절", dates: [utc(year, 10, 3)], rule: sub ? "wk" : "none" });
  groups.push({ name: "한글날", dates: [utc(year, 10, 9)], rule: sub ? "wk" : "none" });
  groups.push({ name: "성탄절", dates: [utc(year, 12, 25)], rule: sub ? "wk" : "none" });

  const count = {};
  groups.forEach((g) => g.dates.forEach((dt) => { count[dt.getTime()] = (count[dt.getTime()] || 0) + 1; }));
  const taken = (dt) => !!map[key(dt)];
  groups.forEach((g) => g.dates.forEach((dt) => { map[key(dt)] = g.name; }));
  Object.keys(TEMP_HOLIDAYS).forEach((k) => {
    const dt = new Date(k + "T00:00:00Z");
    if (dt.getUTCFullYear() === year) map[key(dt)] = TEMP_HOLIDAYS[k];
  });
  // 대체공휴일 (2014년부터 설·추석·어린이날, 2021년부터 국경일 등 확대)
  groups.forEach((g) => {
    let need = false;
    const dows = g.dates.map((dt) => dt.getUTCDay());
    const overlap = g.dates.some((dt) => count[dt.getTime()] > 1);
    if (g.rule === "holiday" && year >= 2014) need = dows.includes(0) || overlap;
    else if (g.rule === "child" && year >= 2014) need = dows[0] === 0 || overlap || (sub && dows[0] === 6);
    else if (g.rule === "wk") need = dows[0] === 0 || dows[0] === 6;
    if (!need) return;
    let dt = addDays(g.dates[g.dates.length - 1], 1);
    while (dt.getUTCDay() === 0 || dt.getUTCDay() === 6 || taken(dt)) dt = addDays(dt, 1);
    map[key(dt)] = "대체공휴일(" + g.name + ")";
  });
  return (holidayCache[year] = map);
}

/**
 * 해당 양력 날짜의 공휴일 이름 반환
 * @param {number} y 양력 연
 * @param {number} m 양력 월
 * @param {number} d 양력 일
 * @returns {string|undefined}
 */
function getHolidayName(y, m, d) { return getHolidays(y)[m + "-" + d]; }

const now = new Date();
const today = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
const state = { y: today.y, m: today.m, selected: null };
const el = (id) => document.getElementById(id);

/** 월 버튼과 연도 표시 갱신 */
function renderMonths() {
  el("yearLabel").textContent = state.y + "년";
  el("months").innerHTML = "";
  for (let m = 1; m <= 12; m++) {
    const b = document.createElement("button");
    b.textContent = m + "월";
    if (m === state.m) b.className = "active";
    b.onclick = () => { state.m = m; render(); };
    el("months").appendChild(b);
  }
}

/**
 * 그 달의 몇째 주인지 계산 (1일이 속한 줄이 1주차, 일요일 시작 기준)
 * @param {number} y 양력 연
 * @param {number} m 양력 월
 * @param {number} d 양력 일
 * @returns {number}
 */
function getWeekOfMonth(y, m, d) {
  const firstDow = new Date(y, m - 1, 1).getDay();
  return Math.floor((firstDow + d - 1) / 7) + 1;
}

const MEMO_KEY = "calendarMemos";
let memoStore = {};
try { memoStore = JSON.parse(localStorage.getItem(MEMO_KEY)) || {}; } catch (e) { memoStore = {}; }

/**
 * 메모를 브라우저(localStorage)에 저장
 * 저장소를 쓸 수 없으면 현재 페이지 동안만 유지됨
 */
function persistMemos() {
  try { localStorage.setItem(MEMO_KEY, JSON.stringify(memoStore)); } catch (e) { /* 저장소 사용 불가 */ }
}

/**
 * 날짜 키 생성
 * @param {number} y 연
 * @param {number} m 월
 * @param {number} d 일
 * @returns {string} "YYYY-MM-DD"
 */
function dateKey(y, m, d) {
  return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

let memoEditingKey = null;

/**
 * 메모 편집 창 열기
 * @param {number} y 연
 * @param {number} m 월
 * @param {number} d 일
 */
function openMemo(y, m, d) {
  memoEditingKey = dateKey(y, m, d);
  el("memoDate").textContent = y + "년 " + m + "월 " + d + "일 (" + WEEKDAYS[new Date(y, m - 1, d).getDay()] + ")";
  el("memoSub").textContent = getHolidayName(y, m, d) || "";
  el("memoText").value = memoStore[memoEditingKey] || "";
  el("memoDelete").style.visibility = memoStore[memoEditingKey] ? "visible" : "hidden";
  el("memoDialog").showModal();
  el("memoText").focus();
}

/** 메모 저장 (내용이 비어 있으면 삭제) */
function saveMemo() {
  const text = el("memoText").value.trim();
  if (text) memoStore[memoEditingKey] = text; else delete memoStore[memoEditingKey];
  persistMemos();
  el("memoDialog").close();
  renderCalendar();
}

/** 메모 삭제 */
function deleteMemo() {
  delete memoStore[memoEditingKey];
  persistMemos();
  el("memoDialog").close();
  renderCalendar();
}

/** 선택된 연/월의 달력 그리기 */
function renderCalendar() {
  el("monthTitle").textContent = state.y + "년 " + state.m + "월";
  const grid = el("grid");
  grid.innerHTML = "";
  grid.classList.remove("flip");
  void grid.offsetWidth; // 애니메이션 재시작
  grid.classList.add("flip");
  const firstDow = new Date(state.y, state.m - 1, 1).getDay();
  const days = new Date(state.y, state.m, 0).getDate();
  const isThisMonth = state.y === today.y && state.m === today.m;
  const todayWeek = isThisMonth ? getWeekOfMonth(today.y, today.m, today.d) : 0;
  const addWeekLabel = (w) => grid.insertAdjacentHTML("beforeend", '<div class="wk' + (w === todayWeek ? " cur" : "") + '">' + w + "주</div>");
  addWeekLabel(1);
  for (let i = 0; i < firstDow; i++) grid.insertAdjacentHTML("beforeend", '<div class="cell blank"></div>');
  for (let d = 1; d <= days; d++) {
    const dow = (firstDow + d - 1) % 7;
    if (dow === 0 && d > 1) addWeekLabel(getWeekOfMonth(state.y, state.m, d));
    let cls = "cell" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "");
    if (state.y === today.y && state.m === today.m && d === today.d) cls += " today";
    const s = state.selected;
    if (s && s.y === state.y && s.m === state.m && s.d === d) cls += " selected";
    const hn = getHolidayName(state.y, state.m, d);
    if (hn) cls += " holiday";
    const memo = memoStore[dateKey(state.y, state.m, d)];
    const cell = document.createElement("div");
    cell.className = cls;
    cell.tabIndex = 0;
    cell.setAttribute("role", "button");
    cell.dataset.day = d;
    if (hn) cell.title = hn;
    const solar = document.createElement("span");
    solar.className = "solar";
    solar.textContent = d;
    cell.appendChild(solar);
    if (hn) {
      const hs = document.createElement("span");
      hs.className = "hname";
      hs.textContent = hn;
      cell.appendChild(hs);
    }
    if (memo) {
      const ms = document.createElement("span");
      ms.className = "memo";
      ms.textContent = memo;
      cell.appendChild(ms);
    }
    grid.appendChild(cell);
  }
}

/** 전체 화면 갱신 */
function render() { renderMonths(); renderCalendar(); }

/** 입력된 음력 날짜를 양력으로 변환하고 달력을 이동 */
function convert() {
  const res = el("result");
  res.className = "error";
  const year = parseInt(el("lunarYear").value, 10);
  const month = parseInt(el("lunarMonth").value, 10);
  const day = parseInt(el("lunarDay").value, 10);
  const isLeap = el("lunarLeap").checked;
  if (!year || !day) { res.textContent = "음력 연도와 일을 입력해 주세요."; return; }
  const r = lunarToSolar(year, month, isLeap, day);
  if (!r.date) { res.textContent = r.error; return; }
  const { y, m, d } = r.date;
  const wd = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  const hn = getHolidayName(y, m, d);
  res.className = "";
  res.textContent = "음력 " + year + "년 " + (isLeap ? "윤" : "") + month + "월 " + day + "일 → 양력 " + y + "년 " + m + "월 " + d + "일 (" + wd + ") · " + m + "월 " + getWeekOfMonth(y, m, d) + "주차" + (hn ? " · " + hn : "");
  state.y = y; state.m = m; state.selected = { y, m, d };
  render();
}

/** 변환 입력칸의 초기값(오늘의 음력)을 채움 */
function initConvertForm() {
  for (let m = 1; m <= 12; m++) el("lunarMonth").insertAdjacentHTML("beforeend", '<option value="' + m + '">' + m + "</option>");
  const l = solarToLunar(today.y, today.m, today.d);
  if (l) {
    el("lunarYear").value = l.year; el("lunarMonth").value = l.month;
    el("lunarDay").value = l.day; el("lunarLeap").checked = l.isLeap;
  }
}

initConvertForm();
el("grid").addEventListener("click", (e) => {
  const cell = e.target.closest(".cell[data-day]");
  if (cell) openMemo(state.y, state.m, +cell.dataset.day);
});
el("grid").addEventListener("keydown", (e) => {
  const cell = e.target.closest(".cell[data-day]");
  if (cell && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openMemo(state.y, state.m, +cell.dataset.day); }
});
el("memoSave").onclick = saveMemo;
el("memoDelete").onclick = deleteMemo;
el("memoCancel").onclick = () => el("memoDialog").close();
el("memoText").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveMemo(); });
el("convertBtn").onclick = convert;
["lunarYear", "lunarDay"].forEach((id) => el(id).addEventListener("keydown", (e) => { if (e.key === "Enter") convert(); }));
el("prevYear").onclick = () => { if (state.y > 1900) { state.y--; render(); } };
el("nextYear").onclick = () => { if (state.y < 2100) { state.y++; render(); } };
render();
</script>
</body>
